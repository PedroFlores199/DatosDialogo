name: Validate analyst and exports
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: docker compose up -d --wait postgres
      - run: mvn -B verify
        env:
          DIALOGO_TEST_DB_URL: jdbc:postgresql://localhost:55434/dialogo
      - run: docker build -t datos-dialogo:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: target/surefire-reports/*.xml
      - run: docker compose down
        if: always()
